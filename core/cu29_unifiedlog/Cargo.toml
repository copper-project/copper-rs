[package]
name = "cu29-unifiedlog"
description = "The super quick, linear, unified logging system (text + task data) used by Copper. This crate can be used independently from the Copper project."
documentation = "https://docs.rs/cu29-unifiedlog"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
cu29-traits = { workspace = true }
bincode = { workspace = true }
memmap2 = { version = "0.9", optional = true }
spin = { workspace = true }
portable-atomic = { version = "1.11", default-features = false, features = [
  "fallback",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
multi-build-log-append = []
default = ["std", "compact"]
std = ["dep:memmap2", "dep:windows-sys", "cu29-traits/std", "bincode/std"]
compact = []                                                               # favor compactness over pure memory page alignment in the log
mmap-fsync = ["std"]
