[package]
name = "cu29-build"
description = "Build-script support for Copper crates and applications."
documentation = "https://docs.rs/cu29-build"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
cu29-value = { workspace = true, optional = true, features = [
  "decode-catalog-build",
] }
cu29-traits = { workspace = true, optional = true, features = ["std"] }

[features]
self-describing-logs = ["dep:cu29-value", "dep:cu29-traits"]
