[package]
name = "cu-rerun-soft-arm"
description = "Custom Copper payload representation: tendon lengths rendered as a soft robot arm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.copper]
environments = ["host"]
ci_exclude_workspace = true

[features]
default = ["rerun", "viewer"]
rerun = ["dep:cu-rerun", "dep:nalgebra", "cu29/reflect"]
app = ["rerun", "cu29/textlogs"]
viewer = ["app", "dep:rerun", "dep:clap", "dep:ctrlc", "dep:tokio"]
debug = ["app", "cu29/rerun"]

[dependencies]
cu29 = { path = "../../core/cu29", version = "~1.4.0-dev", default-features = false, features = [
  "std",
  "units",
] }
bincode = { workspace = true }
serde = { workspace = true }
cu-rerun = { path = "../../components/libs/cu_rerun", version = "~1.4.0-dev", optional = true }
nalgebra = { version = "0.35.0", default-features = false, features = [
  "std",
], optional = true }
rerun = { version = "=0.43.2", default-features = false, features = [
  "sdk",
  "native_viewer",
], optional = true }
clap = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[build-dependencies]
cu29-build = { workspace = true }

[[bin]]
name = "cu-rerun-soft-arm"
path = "src/main.rs"
required-features = ["viewer"]

[[bin]]
name = "soft-arm-resim"
path = "src/resim.rs"
required-features = ["debug"]

[dev-dependencies]
cu29-traits = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
