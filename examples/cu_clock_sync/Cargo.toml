[package]
name = "cu-clock-sync"
description = "Copper PTP clock synchronization example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "clock-sync-mock"

[dependencies]
cu29 = { workspace = true, features = ["clock-sync"] }
cu29-export = { workspace = true }
cu29-unifiedlog = { workspace = true }
cu-ptp = { path = "../../components/res/cu_ptp", optional = true, features = [
  "linux-phc",
] }

[build-dependencies]
cu29-build = { workspace = true }

[features]
default = []
linux-ptp = ["dep:cu-ptp"]

[[bin]]
name = "clock-sync-mock"
path = "src/bin/mock.rs"

[[bin]]
name = "clock-sync-linux"
path = "src/bin/linux.rs"
required-features = ["linux-ptp"]

[[bin]]
name = "clock-sync-software"
path = "src/bin/software.rs"
required-features = ["linux-ptp"]

[[bin]]
name = "clock-sync-logreader"
path = "src/bin/logreader.rs"
