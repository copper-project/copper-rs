[package]
name = "cu-udp-telemetry"
description = "Example customer telemetry protocol over plain UDP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.copper]
kind = "example"
environments = ["host", "embedded"]
domains = ["logging/streaming"]

[features]
default = []
host = ["loopback", "cu29/logstream", "cu-logstream-demo/demo"]
threadless = ["loopback"]
loopback = ["cu29/telemetry", "dep:cu29-logstream-udp", "cu-logstream-demo/arm"]

[dependencies]
bincode.workspace = true
cu29-logstream.workspace = true
cu29-runtime.workspace = true
cu29-traits.workspace = true
cu29 = { workspace = true, optional = true, features = ["std", "reflect"] }
cu29-logstream-udp = { workspace = true, optional = true }
cu-logstream-demo = { path = "../cu_logstream_demo", optional = true }

[build-dependencies]
cu29-build.workspace = true

[[bin]]
name = "cu-udp-telemetry"
required-features = ["loopback"]

[dev-dependencies]
tempfile.workspace = true

[lints.cargo]
# Workspace cu29 feature flags can activate the dependency while the host binary is disabled.
unused_dependencies = "allow"
