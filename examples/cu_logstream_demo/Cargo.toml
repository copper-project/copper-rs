[package]
name = "cu-logstream-demo"
description = "Two-process deterministic Copper log streaming over UDP"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
self-describing-logs = [
  "demo",
  "cu29/self-describing-logs",
  "cu29-export/self-describing-logs",
]
verify-reconstruction = ["demo", "cu29/logstream-verify"]
# Keep async runtime features out of ordinary workspace builds.
arm = [
  "dep:cu29",
  "dep:serde",
  "cu29/reflect",
  "cu29/units",
  "dep:cu-transform",
]
demo = [
  "arm",
  "dep:cu29-logstream",
  "dep:cu29-unifiedlog",
  "dep:clap",
  "dep:cu29-export",
  "dep:cu29-logstream-udp",
  "cu29/logstream",
]
replay = ["demo", "cu29/remote-debug"]
tui = ["demo", "dep:ratatui", "dep:cu29-intern-strs"]
sender-monitor = ["demo", "dep:cu-consolemon"]
feedback = ["demo"]

[[bin]]
name = "cu-logstream-demo"
path = "src/main.rs"
required-features = ["demo"]

[[bin]]
name = "cu-logstream-demo-logreader"
path = "src/logreader.rs"
required-features = ["demo"]

[[bin]]
name = "cu-logstream-demo-resim"
path = "src/resim.rs"
required-features = ["replay"]

[dependencies]
cu29 = { workspace = true, optional = true }
cu-transform = { version = "~1.4.0-dev", path = "../../components/libs/cu_transform", optional = true }
cu-consolemon = { version = "~1.4.0-dev", path = "../../components/monitors/cu_consolemon", default-features = false, features = [
  "dag",
  "hop",
], optional = true }
cu29-logstream = { workspace = true, features = ["std"], optional = true }
cu29-logstream-udp = { workspace = true, optional = true }
cu29-export = { workspace = true, optional = true }
cu29-unifiedlog = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
serde = { workspace = true, optional = true }
cu29-intern-strs = { workspace = true, optional = true }
ratatui = { version = "0.30", optional = true }

[build-dependencies]
cu29-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.cargo]
# Workspace dependency feature flags can enable optional dependencies without enabling this demo.
unused_dependencies = "allow"
