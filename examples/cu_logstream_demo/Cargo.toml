[package]
name = "cu-logstream-demo"
description = "Two-process deterministic Copper log streaming over UDP"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
verify-reconstruction = ["demo", "cu29/logstream-verify"]
# Keep async runtime features out of ordinary workspace builds.
demo = ["cu29/logstream", "cu29/reflect", "dep:cu-transform"]
replay = ["demo", "cu29/remote-debug"]
tui = ["demo", "dep:ratatui", "dep:cu29-intern-strs"]
sender-monitor = ["demo", "dep:cu-consolemon"]

[[bin]]
name = "cu-logstream-demo"
path = "src/main.rs"
required-features = ["demo"]

[[bin]]
name = "cu-logstream-demo-logreader"
path = "src/logreader.rs"
required-features = ["demo"]

[[bin]]
name = "cu-logstream-demo-resim"
path = "src/resim.rs"
required-features = ["replay"]

[dependencies]
cu29 = { workspace = true }
cu-transform = { path = "../../components/libs/cu_transform", optional = true }
cu-consolemon = { path = "../../components/monitors/cu_consolemon", default-features = false, optional = true }
cu29-logstream = { workspace = true, features = ["std"] }
cu29-logstream-udp = { workspace = true }
cu29-export = { workspace = true }
cu29-unifiedlog = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
cu29-intern-strs = { workspace = true, optional = true }
ratatui = { version = "0.30", optional = true }

[build-dependencies]
cu29-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
