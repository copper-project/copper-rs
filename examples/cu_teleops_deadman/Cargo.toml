[package]
name = "cu-teleops-deadman"
description = "Measure a deadman trip over UDP with FEC telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cu29 = { workspace = true, features = ["teleops", "logstream"] }
cu29-clock = { workspace = true, features = ["clock-sync"] }
cu29-logstream-udp.workspace = true
cu-consolemon.workspace = true
ratatui = "0.30"
serde.workspace = true

[[bin]]
name = "robot"
path = "src/robot.rs"

[[bin]]
name = "twin"
path = "src/twin.rs"

[build-dependencies]
cu29-build.workspace = true
