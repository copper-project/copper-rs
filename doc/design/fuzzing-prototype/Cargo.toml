[package]
name = "copper-libafl-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libafl = { version = "=0.16.1", default-features = false, features = [
  "std",
  "serdeany_autoreg",
] }
libafl_bolts = { version = "=0.16.1", default-features = false, features = [
  "std",
] }
serde = { version = "1.0", features = ["derive"] }
cu29-runtime = { path = "../../../core/cu29_runtime", features = ["reflect"] }
cu29-clock = { path = "../../../core/cu29_clock" }
bincode = { package = "cu-bincode", path = "../../../core/cu_bincode" }
bevy_reflect = { version = "=0.19.1", default-features = false }
