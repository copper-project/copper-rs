<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="title desc">
<title id="title">Disk retention and segment ownership</title><desc id="desc">Completed output feeds full-fidelity capture and a smaller baseline archive. Events reference shared immutable segments; independent expired segments can be reclaimed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a6adc8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="775" fill="#000000"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="52" font-size="28" fill="#cdd6f4" text-anchor="start" font-weight="600">Disk retention and segment ownership</text><text x="40" y="87" font-size="17" fill="#a6adc8" text-anchor="start" font-weight="400">One capture history · shared event references</text><rect x="40" y="125" width="260" height="108" rx="12" fill="#181825" stroke="#89b4fa"/><text x="58" y="157" font-size="20" fill="#89b4fa" text-anchor="start" font-weight="600">Completed output</text><text x="58" y="185" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">CopperList + keyframe</text><rect x="410" y="125" width="315" height="108" rx="12" fill="#181825" stroke="#89b4fa"/><text x="428" y="157" font-size="20" fill="#89b4fa" text-anchor="start" font-weight="600">Capture history</text><text x="428" y="185" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Full-rate lossless profile union</text><rect x="410" y="300" width="315" height="108" rx="12" fill="#181825" stroke="#cba6f7"/><text x="428" y="332" font-size="20" fill="#cba6f7" text-anchor="start" font-weight="600">Baseline archive</text><text x="428" y="360" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Detections / sampled / empty</text><path d="M300 178 L410 178" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 178 L330 354" fill="none" stroke="#a6adc8" stroke-width="2"/><path d="M330 354 L410 354" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="835" y="125" width="320" height="108" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="853" y="157" font-size="20" fill="#a6e3a1" text-anchor="start" font-weight="600">Retention coordinator</text><text x="853" y="185" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Window + replay dependencies</text><path d="M725 178 L835 178" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="457" font-size="20" fill="#cdd6f4" text-anchor="start" font-weight="600">Independent segments</text><rect x="40" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6adc8"/><text x="111" y="513" font-size="20" fill="#a6adc8" text-anchor="middle" font-weight="400">S0</text><text x="111" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">expired</text><rect x="201" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="272" y="513" font-size="20" fill="#a6e3a1" text-anchor="middle" font-weight="400">S1</text><text x="272" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">sealed</text><rect x="362" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="433" y="513" font-size="20" fill="#a6e3a1" text-anchor="middle" font-weight="400">S2</text><text x="433" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">sealed</text><rect x="523" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="594" y="513" font-size="20" fill="#a6e3a1" text-anchor="middle" font-weight="400">S3</text><text x="594" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">sealed</text><rect x="684" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="755" y="513" font-size="20" fill="#a6e3a1" text-anchor="middle" font-weight="400">S4</text><text x="755" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">sealed</text><rect x="845" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="916" y="513" font-size="20" fill="#a6e3a1" text-anchor="middle" font-weight="400">S5</text><text x="916" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">sealed</text><rect x="1006" y="481" width="143" height="87" rx="12" fill="#181825" stroke="#89b4fa"/><text x="1077" y="513" font-size="20" fill="#89b4fa" text-anchor="middle" font-weight="400">S6</text><text x="1077" y="543" font-size="16" fill="#a6adc8" text-anchor="middle" font-weight="400">writing</text><path d="M211 595 L666 595" fill="none" stroke="#a6e3a1" stroke-width="2"/><text x="438" y="624" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">Event A → S1, S2, S3</text><path d="M533 649 L988 649" fill="none" stroke="#cba6f7" stroke-width="2"/><text x="760" y="678" font-size="18" fill="#cba6f7" text-anchor="middle" font-weight="400">Event B → S3, S4, S5</text><text x="40" y="735" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Reclaim expired, unreferenced segments; preserve shared bytes once</text><rect x="835" y="300" width="320" height="108" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="853" y="332" font-size="20" fill="#a6e3a1" text-anchor="start" font-weight="600">Event manifests</text><text x="853" y="360" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Profile · bounds · gaps · refs</text><path d="M995 233 L995 300" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/></g>
</svg>
