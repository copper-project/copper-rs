<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Migration from rollover to event retention</title><desc id="desc">Six implementation milestones: bounded segments, event retention, replay coverage, baseline profiles, producers, then durable storage and embedded adapters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a6adc8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="750" fill="#000000"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="52" font-size="28" fill="#cdd6f4" text-anchor="start" font-weight="600">Migration from rollover to event retention</text><text x="40" y="87" font-size="17" fill="#a6adc8" text-anchor="start" font-weight="400">Incremental delivery · explicit exit criteria</text><rect x="40" y="125" width="540" height="140" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="60" y="160" font-size="25" fill="#a6e3a1" text-anchor="start" font-weight="600">1</text><text x="105" y="160" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Segment store</text><text x="60" y="200" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Rotate · index · reclaim</text><text x="60" y="236" font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="400">Bounded mappings and caches</text><path d="M580 195 L613 195" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="125" width="540" height="140" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="640" y="160" font-size="25" fill="#a6e3a1" text-anchor="start" font-weight="600">2</text><text x="685" y="160" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Triggered retention</text><text x="640" y="200" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Manual event · reference journal</text><text x="640" y="236" font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="400">Shared overlaps; capacity rejection</text><rect x="40" y="303" width="540" height="140" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="60" y="338" font-size="25" fill="#a6e3a1" text-anchor="start" font-weight="600">3</text><text x="105" y="338" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Replay coverage</text><text x="60" y="378" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Checkpoint · warm-up · watermarks</text><text x="60" y="414" font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="400">Stateful replay; visible gaps</text><path d="M580 373 L613 373" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="303" width="540" height="140" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="640" y="338" font-size="25" fill="#a6e3a1" text-anchor="start" font-weight="600">4</text><text x="685" y="338" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Baseline + profiles</text><text x="640" y="378" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Generated views · codec catalogs</text><text x="640" y="414" font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="400">Detections always; images on event</text><rect x="40" y="481" width="540" height="140" rx="12" fill="#181825" stroke="#cba6f7"/><text x="60" y="516" font-size="25" fill="#cba6f7" text-anchor="start" font-weight="600">5</text><text x="105" y="516" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Event producers</text><text x="60" y="556" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Button · remote · ML · novelty</text><text x="60" y="592" font-size="17" fill="#cba6f7" text-anchor="start" font-weight="400">One typed admission contract</text><path d="M580 551 L613 551" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="481" width="540" height="140" rx="12" fill="#181825" stroke="#cba6f7"/><text x="640" y="516" font-size="25" fill="#cba6f7" text-anchor="start" font-weight="600">6</text><text x="685" y="516" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="600">Durability + adapters</text><text x="640" y="556" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Recovery · export · SD slots</text><text x="640" y="592" font-size="17" fill="#cba6f7" text-anchor="start" font-weight="400">Fault injection; no_std boundary</text><text x="40" y="708" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Production gate: 1–4 + leased export + conservative restart ownership</text></g>
</svg>
