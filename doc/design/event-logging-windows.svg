<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Window and replay coverage</title><desc id="desc">A visible event starts after its predecessor checkpoint. Replay retains the warm-up prefix and whole segments before the requested window.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a6adc8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="590" fill="#000000"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="52" font-size="28" fill="#cdd6f4" text-anchor="start" font-weight="600">Window and replay coverage</text><text x="40" y="87" font-size="17" fill="#a6adc8" text-anchor="start" font-weight="400">One event · local raw timeline</text><path d="M220 145 L220 460" fill="none" stroke="#45475a" stroke-width="2" stroke-dasharray="6 5"/><text x="220" y="128" font-size="18" fill="#cdd6f4" text-anchor="middle" font-weight="400">checkpoint k</text><path d="M390 145 L390 460" fill="none" stroke="#45475a" stroke-width="2" stroke-dasharray="6 5"/><text x="390" y="128" font-size="18" fill="#cdd6f4" text-anchor="middle" font-weight="400">t − before</text><path d="M690 145 L690 460" fill="none" stroke="#45475a" stroke-width="2" stroke-dasharray="6 5"/><text x="690" y="128" font-size="18" fill="#cba6f7" text-anchor="middle" font-weight="400">trigger t</text><path d="M990 145 L990 460" fill="none" stroke="#45475a" stroke-width="2" stroke-dasharray="6 5"/><text x="990" y="128" font-size="18" fill="#cdd6f4" text-anchor="middle" font-weight="400">t + after</text><path d="M200 172 L1120 172" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="228" font-size="18" fill="#cdd6f4" text-anchor="start" font-weight="400">Disk history</text><rect x="220" y="202" width="770" height="40" rx="12" fill="#181825" stroke="#89b4fa"/><text x="605" y="228" font-size="18" fill="#89b4fa" text-anchor="middle" font-weight="400">continuous lossless capture</text><text x="40" y="298" font-size="18" fill="#cdd6f4" text-anchor="start" font-weight="400">Visible event</text><rect x="390" y="272" width="600" height="40" rx="12" fill="#181825" stroke="#cba6f7"/><text x="690" y="298" font-size="18" fill="#cba6f7" text-anchor="middle" font-weight="400">requested interval</text><text x="40" y="368" font-size="18" fill="#cdd6f4" text-anchor="start" font-weight="400">Replay input</text><rect x="220" y="342" width="170" height="40" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="305" y="368" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">warm-up</text><rect x="390" y="342" width="600" height="40" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="690" y="368" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">selected cycles + boundary inputs</text><text x="40" y="435" font-size="18" fill="#cdd6f4" text-anchor="start" font-weight="400">Disk segments</text><rect x="205" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="256" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S0</text><rect x="316" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="367" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S1</text><rect x="427" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="478" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S2</text><rect x="538" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="589" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S3</text><rect x="649" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="700" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S4</text><rect x="760" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="811" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S5</text><rect x="871" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="922" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S6</text><rect x="982" y="408" width="103" height="48" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="1033" y="438" font-size="18" fill="#a6e3a1" text-anchor="middle" font-weight="400">S7</text><text x="40" y="510" font-size="19" fill="#a6e3a1" text-anchor="start" font-weight="400">Retained: predecessor checkpoint → final covered cycle</text><text x="40" y="547" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">Completion: producer and output watermarks pass the requested end</text></g>
</svg>
