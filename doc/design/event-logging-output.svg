<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Runtime and recorder control</title><desc id="desc">The runtime sends owned completed slots through a bounded queue. An output worker writes native views and returns slots. Independent trigger producers use a bounded control queue.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a6adc8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="740" fill="#000000"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="52" font-size="28" fill="#cdd6f4" text-anchor="start" font-weight="600">Runtime and recorder control</text><text x="40" y="87" font-size="17" fill="#a6adc8" text-anchor="start" font-weight="400">Bounded runtime handoff · background storage control</text><rect x="30" y="113" width="1140" height="151" rx="12" fill="#181825" stroke="#89b4fa"/><text x="50" y="145" font-size="19" fill="#89b4fa" text-anchor="start" font-weight="600">Runtime thread</text><rect x="50" y="165" width="255" height="77" rx="12" fill="#181825" stroke="#89b4fa"/><text x="68" y="197" font-size="20" fill="#89b4fa" text-anchor="start" font-weight="600">Execute cycle</text><rect x="425" y="165" width="320" height="77" rx="12" fill="#181825" stroke="#89b4fa"/><text x="443" y="197" font-size="20" fill="#89b4fa" text-anchor="start" font-weight="600">Completed slot lease</text><rect x="865" y="165" width="280" height="77" rx="12" fill="#181825" stroke="#89b4fa"/><text x="883" y="197" font-size="20" fill="#89b4fa" text-anchor="start" font-weight="600">Bounded output queue</text><path d="M305 205 L425 205" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 205 L865 205" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="289" width="1140" height="194" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="50" y="321" font-size="19" fill="#a6e3a1" text-anchor="start" font-weight="600">Output worker</text><rect x="50" y="344" width="300" height="110" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="68" y="376" font-size="20" fill="#a6e3a1" text-anchor="start" font-weight="600">Own slot + keyframe</text><text x="68" y="404" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Borrow both output views</text><rect x="445" y="344" width="300" height="110" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="463" y="376" font-size="20" fill="#a6e3a1" text-anchor="start" font-weight="600">Write native records</text><text x="463" y="404" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Keyframe → CopperList</text><rect x="840" y="344" width="305" height="110" rx="12" fill="#181825" stroke="#a6e3a1"/><text x="858" y="376" font-size="20" fill="#a6e3a1" text-anchor="start" font-weight="600">Return slot</text><text x="858" y="404" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">After configured outputs</text><path d="M350 399 L445 399" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 399 L840 399" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M1005 264 L1005 279" fill="none" stroke="#a6adc8" stroke-width="2"/><path d="M1005 279 L240 279" fill="none" stroke="#a6adc8" stroke-width="2"/><path d="M240 279 L240 344" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="540" width="300" height="110" rx="12" fill="#181825" stroke="#cba6f7"/><text x="68" y="572" font-size="20" fill="#cba6f7" text-anchor="start" font-weight="600">Trigger producers</text><text x="68" y="600" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Manual · ML · novelty</text><rect x="445" y="540" width="300" height="110" rx="12" fill="#181825" stroke="#cba6f7"/><text x="463" y="572" font-size="20" fill="#cba6f7" text-anchor="start" font-weight="600">Control queue</text><text x="463" y="600" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Fixed-size requests</text><rect x="840" y="540" width="305" height="110" rx="12" fill="#181825" stroke="#cba6f7"/><text x="858" y="572" font-size="20" fill="#cba6f7" text-anchor="start" font-weight="600">Coordinator</text><text x="858" y="600" font-size="16" fill="#a6adc8" text-anchor="start" font-weight="400">Admission · refs · reclaim</text><path d="M350 595 L445 595" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 595 L840 595" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><path d="M993 488 L993 540" fill="none" stroke="#a6adc8" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="514" font-size="15" fill="#a6adc8" text-anchor="end" font-weight="400">ranges / watermarks</text><text x="40" y="701" font-size="18" fill="#a6adc8" text-anchor="start" font-weight="400">No event-length payload leases · no past-window copy on trigger</text></g>
</svg>
