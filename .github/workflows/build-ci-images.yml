name: Build CI Images

on:
  schedule:
    - cron: "17 3 * * 1"
  # Same-repository PRs and master pushes already build through general.yml.
  # Forks still need a Docker build check without permission to publish images.
  pull_request:
    paths:
      - "support/docker/**"
      - "support/ci/prepare_ci_image.sh"
      - ".github/actions/ci-image/**"
      - ".github/workflows/build-ci-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: Refresh CI image (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: ubuntu-26.04
            dockerfile: Dockerfile.ci-ubuntu26
            cache_scope: linux-ci-image-ubuntu26
          - tag: cuda-12.6.1-ubuntu-24.04
            dockerfile: Dockerfile.ci-cuda-ubuntu24
            cache_scope: linux-cuda-ci-image-ubuntu24
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: ./.github/actions/ci-image
        with:
          tag: ${{ matrix.tag }}
          dockerfile: ${{ matrix.dockerfile }}
          cache_scope: ${{ matrix.cache_scope }}
          refresh: "true"
      - uses: ./.github/actions/ci-resources
        if: always()
        with:
          phase: finish
