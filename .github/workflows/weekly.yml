name: Weekly Beta Checks

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"

jobs:
  fmt-beta:
    name: Beta Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +beta fmt --all -- --check

  linux-beta:
    name: Linux Beta
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      toolchain: beta
      linux_ci_image: ghcr.io/copper-project/copper-rs-ci:ubuntu-26.04
      linux_cuda_ci_image: ghcr.io/copper-project/copper-rs-ci:cuda-12.6.1-ubuntu-24.04
      run_cuda: true

  embedded:
    name: CI for embedded targets
    uses: ./.github/workflows/reusable-embedded.yml
    with:
      toolchain: beta
      linux_runner_label: ubuntu-latest
