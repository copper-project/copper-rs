name: "CI/CD"

on:
  push:
    branches: ["master"]
  # Validate every PR base, including branches used by stacked PRs.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"
  MSRV: "1.95.0"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 support/ci/ci_changes.py
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  linux-ci-image:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Linux CI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: registry_access
        shell: bash
        run: |
          can_use_registry=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
            can_use_registry=false
          fi
          echo "enabled=$can_use_registry" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.registry_access.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_ref
        shell: bash
        run: |
          stable_image="ghcr.io/copper-project/copper-rs-ci:ubuntu-26.04"
          force_rebuild=false
          relevant_image_paths='^support/docker/'

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
              echo "image=" >> "$GITHUB_OUTPUT"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")"
            if grep -Eq "$relevant_image_paths" <<<"$changed_files"; then
              force_rebuild=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true
              changed_files="$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" || true)"
            else
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)"
            fi
            if grep -Eq "$relevant_image_paths" <<<"$changed_files"; then
              force_rebuild=true
            fi
          fi

          if [[ "$force_rebuild" != "true" ]] && docker manifest inspect "$stable_image" >/dev/null 2>&1; then
            echo "image=$stable_image" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_image="ghcr.io/copper-project/copper-rs-ci:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "image=$run_image"
            echo "should_build=true"
            echo "tags<<EOF"
            echo "$run_image"
            if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "$stable_image"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.image_ref.outputs.should_build == 'true'
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build and push Linux CI image
        if: steps.image_ref.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./support/docker
          file: ./support/docker/Dockerfile.ci-ubuntu26
          pull: true
          push: true
          tags: ${{ steps.image_ref.outputs.tags }}
          cache-from: type=gha,scope=linux-ci-image-ubuntu26
          cache-to: type=gha,mode=max,scope=linux-ci-image-ubuntu26
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  linux-cuda-ci-image:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Linux CUDA CI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: registry_access
        shell: bash
        run: |
          can_use_registry=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
            can_use_registry=false
          fi
          echo "enabled=$can_use_registry" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.registry_access.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_ref
        shell: bash
        run: |
          stable_image="ghcr.io/copper-project/copper-rs-ci:cuda-12.6.1-ubuntu-24.04"
          force_rebuild=false
          relevant_image_paths='^support/docker/'

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
              echo "image=" >> "$GITHUB_OUTPUT"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")"
            if grep -Eq "$relevant_image_paths" <<<"$changed_files"; then
              force_rebuild=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true
              changed_files="$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" || true)"
            else
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" || true)"
            fi
            if grep -Eq "$relevant_image_paths" <<<"$changed_files"; then
              force_rebuild=true
            fi
          fi

          if [[ "$force_rebuild" != "true" ]] && docker manifest inspect "$stable_image" >/dev/null 2>&1; then
            echo "image=$stable_image" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_image="ghcr.io/copper-project/copper-rs-ci:cuda-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "image=$run_image"
            echo "should_build=true"
            echo "tags<<EOF"
            echo "$run_image"
            if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "$stable_image"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.image_ref.outputs.should_build == 'true'
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build and push Linux CUDA CI image
        if: steps.image_ref.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./support/docker
          file: ./support/docker/Dockerfile.ci-cuda-ubuntu24
          pull: true
          push: true
          tags: ${{ steps.image_ref.outputs.tags }}
          cache-from: type=gha,scope=linux-cuda-ci-image-ubuntu24
          cache-to: type=gha,mode=max,scope=linux-cuda-ci-image-ubuntu24
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  msrv-container:
    name: MSRV Check
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image != '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.linux-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WORKSPACE_SCOPE: workspace
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: ${{ env.MSRV }}
          linux_cargo_paths: true
          prebaked_linux_image: "true"
          cache_prefix: msrv-ubuntu26-container
          cache_shared_key: rust-ubuntu
          install_nextest: "false"
          sccache_write: "true"
      - name: Detect default workspace exclusions
        run: |
          EXCLUDES=$(python3 support/ci/workspace_excludes.py excludes --toolchain ${{ env.MSRV }})
          echo "WORKSPACE_EXCLUDES=$EXCLUDES" >> $GITHUB_ENV
      - name: Check workspace on MSRV
        run: cargo +${{ env.MSRV }} check --workspace --all-targets $WORKSPACE_EXCLUDES
      - name: Check no_std default members on MSRV
        run: cargo +${{ env.MSRV }} check --no-default-features
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  msrv-host:
    name: MSRV Check
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image == '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    env:
      WORKSPACE_SCOPE: workspace
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: ${{ env.MSRV }}
          linux_cargo_paths: true
          linux_disk_workarounds: "false"
          cache_prefix: msrv-ubuntu-host
          cache_shared_key: rust-ubuntu
          install_nextest: "false"
          sccache_write: "true"
      - name: Detect default workspace exclusions
        run: |
          EXCLUDES=$(python3 support/ci/workspace_excludes.py excludes --toolchain ${{ env.MSRV }})
          echo "WORKSPACE_EXCLUDES=$EXCLUDES" >> $GITHUB_ENV
      - name: Check workspace on MSRV
        run: cargo +${{ env.MSRV }} check --workspace --all-targets $WORKSPACE_EXCLUDES
      - name: Check no_std default members on MSRV
        run: cargo +${{ env.MSRV }} check --no-default-features
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  Unit-Tests-Other:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Unit Tests
    uses: ./.github/workflows/reusable-unit-tests.yml
    secrets: inherit
    with:
      toolchain: stable
      linux_cargo_paths: true
      linux_disk_workarounds: false
      linux_runner_label: ubuntu-latest
      windows_runner_label: windows-latest
      run_linux: false
      run_cuda: false
      run_other: true

  Unit-Tests-Linux:
    if: needs.changes.outputs.code == 'true'
    name: Unit Tests
    needs: [changes, linux-ci-image]
    uses: ./.github/workflows/reusable-unit-tests.yml
    secrets: inherit
    with:
      toolchain: stable
      linux_cargo_paths: true
      linux_disk_workarounds: false
      linux_ci_image: ${{ needs.linux-ci-image.outputs.image }}
      linux_runner_label: ubuntu-latest
      linux_light_runner_label: ubuntu-latest
      windows_runner_label: windows-latest
      run_linux: true
      run_cuda: false
      run_other: false

  Unit-Tests-CUDA:
    if: needs.changes.outputs.code == 'true'
    name: Unit Tests
    needs: [changes, linux-cuda-ci-image]
    uses: ./.github/workflows/reusable-unit-tests.yml
    secrets: inherit
    with:
      toolchain: stable
      linux_cargo_paths: true
      linux_disk_workarounds: false
      linux_cuda_ci_image: ${{ needs.linux-cuda-ci-image.outputs.image }}
      linux_runner_label: ubuntu-latest
      windows_runner_label: windows-latest
      run_linux: false
      run_cuda: true
      run_other: false

  extra-examples-container:
    name: Extra Examples
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image != '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.linux-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WORKSPACE_SCOPE: core
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: stable
          linux_cargo_paths: true
          prebaked_linux_image: "true"
          cache_prefix: extra-examples-ubuntu26-container
          cache_shared_key: rust-ubuntu-latest
          install_nextest: "false"
      - name: Install embedded targets
        run: rustup target add thumbv8m.main-none-eabihf thumbv7em-none-eabihf --toolchain stable
      - name: Check extra examples
        run: just check-extra-examples
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  extra-examples-host:
    name: Extra Examples
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image == '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    env:
      WORKSPACE_SCOPE: core
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: stable
          linux_cargo_paths: true
          linux_disk_workarounds: "false"
          cache_prefix: extra-examples-ubuntu-host
          cache_shared_key: rust-ubuntu-latest
          install_nextest: "false"
      - name: Install embedded targets
        run: rustup target add thumbv8m.main-none-eabihf thumbv7em-none-eabihf --toolchain stable
      - name: Check extra examples
        run: just check-extra-examples
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  benchmarks-container:
    name: Benchmarks
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image != '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.linux-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WORKSPACE_SCOPE: core
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: stable
          linux_cargo_paths: true
          prebaked_linux_image: "true"
          cache_prefix: benchmarks-ubuntu26-container
          cache_shared_key: rust-ubuntu-latest
          install_nextest: "false"
      - name: Check benchmarks
        run: just check-benchmarks
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  benchmarks-host:
    name: Benchmarks
    if: needs.changes.outputs.code == 'true' && (needs.linux-ci-image.outputs.image == '')
    needs: [changes, linux-ci-image]
    runs-on: ubuntu-latest
    env:
      WORKSPACE_SCOPE: core
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - id: rust_ci_setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: stable
          linux_cargo_paths: true
          linux_disk_workarounds: "false"
          cache_prefix: benchmarks-ubuntu-host
          cache_shared_key: rust-ubuntu-latest
          install_nextest: "false"
      - name: Check benchmarks
        run: just check-benchmarks
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  coverage:
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request')
    name: Coverage
    needs: [changes, linux-ci-image]
    uses: ./.github/workflows/reusable-coverage.yml
    secrets: inherit
    with:
      toolchain: stable
      linux_cargo_paths: true
      linux_disk_workarounds: false
      linux_ci_image: ${{ needs.linux-ci-image.outputs.image }}
      linux_runner_label: ubuntu-latest

  api:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Public API Check
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_VERSION: "0.51.0"
      PUBLIC_API_TOOLCHAIN: nightly-2026-06-25
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: dtolnay/rust-toolchain@stable
      - name: Install public API Rust toolchain
        run: rustup toolchain install "${PUBLIC_API_TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: api-check
          shared-key: rust-ubuntu
          cache-bin: "true"
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Install cargo-public-api
        run: |
          if ! cargo +stable public-api --version 2>/dev/null | grep -qx "cargo-public-api ${PUBLIC_API_VERSION}"; then
            cargo +stable install --locked cargo-public-api --version "${PUBLIC_API_VERSION}" --force
          fi
      - name: Check public API snapshots
        run: support/ci/check_public_api.sh
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - name: Check workspace CI exclusions
        run: |
          python3 -m unittest discover -s support/ci -p test_workspace_excludes.py
          python3 -m unittest discover -s support/ci -p test_ci_changes.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install formatting tools
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: taplo-cli, fmtron@0.10.0, typos
      - name: Install actionlint
        run: |
          GOBIN="$GITHUB_WORKSPACE/target/ci-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "$GITHUB_WORKSPACE/target/ci-tools" >> "$GITHUB_PATH"
      - name: Validate Actions workflows
        # Existing Cargo flag lists expand to multiple shell arguments.
        run: actionlint -ignore 'shellcheck reported issue.*SC2086'
      - name: Check Rust, TOML, RON formatting
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            trailing-whitespace
            check-merge-conflict
            detect-private-key
            check-case-conflict
            check-added-large-files
            check-yaml
            check-json
            check-xml
            check-symlinks
            mixed-line-ending
            typos
            check-rust
            check-ron
            check-toml
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  embedded:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: CI for embedded targets
    uses: ./.github/workflows/reusable-embedded.yml
    with:
      toolchain: stable
      linux_runner_label: ubuntu-latest

  cunew:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Project Bootstrap Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start resource measurements
        uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2.87.26
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just cunew-check
      - name: Report resource measurements
        if: always()
        uses: ./.github/actions/ci-resources
        with:
          phase: finish

  ci-status:
    name: CI Status
    if: ${{ always() }}
    needs:
      - changes
      - linux-ci-image
      - linux-cuda-ci-image
      - msrv-container
      - msrv-host
      - Unit-Tests-Other
      - Unit-Tests-Linux
      - Unit-Tests-CUDA
      - extra-examples-container
      - extra-examples-host
      - benchmarks-container
      - benchmarks-host
      - coverage
      - api
      - fmt
      - embedded
      - cunew
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a CI job failed or was cancelled
        if: ${{ needs.changes.result != 'success' || needs.fmt.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Confirm CI succeeded
        run: echo "All CI jobs succeeded or were intentionally skipped."
