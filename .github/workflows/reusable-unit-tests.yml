name: Reusable Linux Tests

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      linux_ci_image:
        type: string
        default: ""
      linux_cuda_ci_image:
        type: string
        default: ""
      run_linux:
        type: boolean
        default: true
      run_cuda:
        type: boolean
        default: false

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  # Reusable workflows do not inherit the caller's environment.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"
  CARGO_NAME: "Copper Tests"
  BASE_FEATURES: cu29/reflect,cu29/async-cl-io,mock,cu-sensor-payloads/image,kornia,gst,faer,nalgebra,glam,debug_pane,bincode,log-level-debug
  CUDA_FEATURE: ""
  WORKSPACE_SCOPE: workspace

jobs:
  linux-container:
    if: inputs.run_linux && inputs.linux_ci_image != ''
    name: linux-container / ${{ matrix.task }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.linux_ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, test, ui, features, doctests, templates]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: ./.github/actions/linux-checks
        with:
          toolchain: ${{ inputs.toolchain }}
          task: ${{ matrix.task }}
          image: ${{ inputs.linux_ci_image }}
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - uses: ./.github/actions/ci-resources
        if: always()
        with:
          phase: finish

  linux-host:
    if: inputs.run_linux && inputs.linux_ci_image == ''
    name: linux-host / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, test, ui, features, doctests, templates]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: ./.github/actions/linux-checks
        with:
          toolchain: ${{ inputs.toolchain }}
          task: ${{ matrix.task }}
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - uses: ./.github/actions/ci-resources
        if: always()
        with:
          phase: finish

  cuda:
    if: inputs.run_cuda && inputs.linux_cuda_ci_image != ''
    name: cuda / ${{ matrix.task }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.linux_cuda_ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, features]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
        with:
          phase: start
      - uses: ./.github/actions/linux-checks
        with:
          toolchain: ${{ inputs.toolchain }}
          task: ${{ matrix.task }}
          image: ${{ inputs.linux_cuda_ci_image }}
          cuda: "true"
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - uses: ./.github/actions/ci-resources
        if: always()
        with:
          phase: finish
