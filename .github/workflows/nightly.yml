name: Nightly Platform and Audit Checks

on:
  push:
    branches: ["ci/nightly-platform-checks"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-deny
      - name: Run deny bans
        run: cargo deny --config .config/deny.toml check bans
      - name: Run deny sources
        run: cargo deny --config .config/deny.toml check sources
      - name: Run deny advisories
        run: cargo deny --config .config/deny.toml check advisories

  native-stable:
    name: Stable Platforms
    uses: ./.github/workflows/reusable-native-tests.yml
    with:
      toolchain: stable
      full: true
