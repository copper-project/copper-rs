name: First time contributors

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: read

jobs:
  comment:
    name: Comment on PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;

            for await (const { data } of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...repo,
              creator: pr.user.login,
              state: 'all',
              per_page: 100,
            })) {
              if (data.some(item => item.pull_request && item.number < pr.number)) {
                return;
              }
            }

            await github.rest.issues.createComment({
              ...repo,
              issue_number: pr.number,
              body: [
                'Hi! Thanks for opening this pull request.',
                '',
                'Because this is your first time contributing to this repository, please read our contributor guide:',
                'https://github.com/copper-project/copper-rs/blob/master/CONTRIBUTING.md',
              ].join('\n'),
            });
