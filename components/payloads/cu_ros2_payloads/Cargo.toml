[package]
name = "cu-ros2-payloads"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cu-ros2-payloads"
description = "ROS2 Payloads that can be constructed from/to Copper Payloads for compatibility"

[package.metadata.copper]
kind = "payload"
domains = ["payload/ros2"]
environments = ["host"]

[dependencies]
compact_str = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
cu-sensor-payloads = { workspace = true }
cu-spatial-payloads = { path = "../cu_spatial_payloads", version = "1.3.0-dev" }
# The geometry itself: quaternion extraction from a rotation matrix and the inverse. Same version
# cu_spatial_payloads uses, and its default `glam` feature is left on so both sides agree.
glam = { version = "0.33" }
cu29 = { workspace = true }

[features]
humble = [] # Activate for ROS 2 Humble compatibility
jazzy = []  # Activate for ROS 2 Jazzy compatibility

[dev-dependencies]
cdr = { version = "0.2.4" }
