[package]
name = "cu-rrt-star"
description = "An anytime RRT* path planner component for the Copper project"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cu-rrt-star"

[package.metadata.copper]
kind = "task"
domains = ["algorithm/planning"]
environments = ["host"]

[dependencies]
bincode = { workspace = true }
cu-rng = { workspace = true }
cu-spatial-payloads = { path = "../../payloads/cu_spatial_payloads", version = "1.2.0-dev", default-features = false }
cu29 = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cu29-build = { workspace = true }
